<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Apartment Hunter{% endblock %}</title>
  <meta name="description" content="Estimez le prix d'une maison du comté de King (Seattle) à partir de ses caractéristiques.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="entete">
    <div class="entete__contenu">
      <a class="logo" href="{{ url_for('accueil') }}">
        <svg class="logo__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Apartment Hunter
      </a>
      <p class="entete__slogan">Estimation du prix d'une maison dans le comté de King (Seattle)</p>
    </div>
  </header>

  <main class="page">
    {% block contenu %}{% endblock %}
  </main>

  <footer class="pied">
    <p>Modèle GradientBoosting entraîné sur 21 597 ventes du comté de King (mai 2014 – mai 2015).
       Les estimations correspondent aux prix de cette période.</p>
    <p>Projet La Plateforme · B3 IA</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
